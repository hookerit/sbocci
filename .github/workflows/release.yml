# One-off cleanup: removes the Sboccy releases (sboccy-v*) and their tags from this public repository.
# Sboccy packages are kept only in the private repository now.
name: Remove Sboccy releases
on:
  push:
    branches: [main]
    paths: [.github/workflows/release.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete sboccy-v* releases and tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for t in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName -q '.[].tagName' | grep '^sboccy-v' || true); do
            echo "deleting $t"
            gh release delete "$t" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          done
