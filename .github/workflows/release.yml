# Creates a Release page (with the .aab and .apk attached) each time sboccy/latest.json changes.
name: Release
on:
  push:
    branches: [main]
    paths: [sboccy/latest.json, .github/workflows/release.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release if it does not exist yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(jq -r .version sboccy/latest.json)
          jq -r .notes sboccy/latest.json > notes.txt
          if gh release view "sboccy-v$VER" >/dev/null 2>&1; then
            echo "sboccy-v$VER already exists"
          else
            gh release create "sboccy-v$VER" "$(jq -r .aab sboccy/latest.json)" "$(jq -r .apk sboccy/latest.json)" \
              --title "Sboccy $VER" --notes-file notes.txt --latest
          fi
